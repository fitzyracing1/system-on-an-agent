name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (includes MCP client tests with the latest MCP SDK)
        run: pytest
      - name: Test with the MCP SDK 1.x client
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install "mcp>=1.2,<2"
          pytest tests/test_mcp_client.py
      - name: CLI demo
        run: |
          soa skills list
          soa connectors list
          soa run "echo hello from system on an agent"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | system-on-an-agent mcp | tee mcp-out.txt
          grep -q '"run_goal"' mcp-out.txt
